<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ request.url_for('static', path='img/logo.png') }}">
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/login.css') }}">
  <title>Esqueci a senha</title>
</head>
<body>
<div class="page" id="page">
  <!-- BRANDING -->
  <div class="branding" id="branding">
    <div class="bg-layer" id="bgLayer"></div>
    <div class="stars" id="stars"></div>
    <div class="brand-content">
      <div class="logo-row">
        <img class="logo-icon" src="{{ request.url_for('static', path='img/logo.png') }}" alt="EasyStore logo" width="500">
        <span class="brand-name" id="brandName">EasyStore</span>
      </div>
      <p class="tagline" id="tagline">PCs, consoles e jogos<br>em um só lugar</p>
      <p class="sub">Seu universo gamer começa aqui ✦</p>
    </div>
  </div>

  <!-- FORM SIDE -->
  <div class="form-side">
    <div class="login-box">
      <h2>Esqueci minha senha</h2>
      {% if erro %}
        <p style="color: red;">{{ erro }}</p>
      {% endif %}

      <form action="/auth/forgot" method="post">
        <div class="input-group">
          <label>E-mail</label>
          <input type="email" name="email" placeholder="Digite o e-mail cadastrado">
        </div>
        <button type="submit" class="btn-confirm">✦ Enviar instruções</button>
      </form>

      {% if reset_link %}
        <div style="margin-top: 20px; text-align: center;">
          <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Link de reset (apenas para desenvolvimento):</p>
          <a href="{{ reset_link }}" class="btn-confirm" style="display: inline-block;">Redefinir senha</a>
        </div>
      {% endif %}

      <p class="footer-text"><a href="/auth/login">Voltar ao login</a></p>
    </div>
  </div>
</div>
<script src="{{ request.url_for('static', path='js/stars.js') }}"></script>
</body>
</html>

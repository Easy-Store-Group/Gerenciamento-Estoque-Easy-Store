<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/login.css') }}">
  <title>Esqueci a senha</title>
</head>
<body>
  <div class="form-side">
    <div class="login-box">
      <h2>Esqueci minha senha</h2>
      {% if erro %}
        <p style="color: red;">{{ erro }}</p>
      {% endif %}
      {% if mensagem %}
        <p style="color: green;">{{ mensagem }}</p>
      {% endif %}

      <form action="/auth/forgot" method="post">
        <div class="input-group">
          <label>E-mail</label>
          <input type="email" name="email" placeholder="Digite o e-mail cadastrado">
        </div>
        <button type="submit" class="btn-confirm">Enviar instruções</button>
      </form>

      {% if reset_link %}
        <p>Link de reset (apenas para desenvolvimento):</p>
        <p><a href="{{ reset_link }}" class="btn-confirm">Redefinir senha</a></p>
      {% endif %}

      <p class="footer-text"><a href="/auth/login">Voltar ao login</a></p>
    </div>
  </div>
</body>
</html>

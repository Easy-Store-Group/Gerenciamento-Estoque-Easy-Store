<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ request.url_for('static', path='img/logo.png') }}">
  <title>Esqueci a senha | EasyStore</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/login.css') }}?v=3">
</head>
<body>
  <main class="page" id="page">
    <aside class="branding" id="branding" aria-label="EasyStore">
      <div class="bg-layer" id="bgLayer"></div>
      <div class="stars" id="stars"></div>
      <div class="brand-content">
        <div class="logo-row">
          <img class="logo-icon" src="{{ request.url_for('static', path='img/logo.png') }}" alt="EasyStore logo">
          <span class="brand-name" id="brandName">EasyStore</span>
        </div>
        <p class="tagline" id="tagline">Recupere sua conta<br>em poucos passos</p>
        <p class="sub">Nós enviaremos instruções para redefinir sua senha.</p>
      </div>
    </aside>

    <section class="form-side" aria-labelledby="forgot-title">
      <div class="login-box">
        <h1 id="forgot-title">Esqueci minha senha</h1>
        {% if erro %}
        <p class="login-error" role="alert">{{ erro }}</p>
        {% endif %}

        <form action="/auth/forgot" method="post">
          <div class="input-group">
            <label for="email">E-mail</label>
            <input id="email" type="email" name="email" placeholder="Digite o e-mail cadastrado" autocomplete="email" required>
          </div>
          <button type="submit" class="btn-confirm">Enviar instruções</button>
        </form>

        {% if reset_link %}
        <div class="reset-dev-box">
          <p>Link de reset, apenas para desenvolvimento:</p>
          <a href="{{ reset_link }}" class="btn-confirm">Redefinir senha</a>
        </div>
        {% endif %}

        <p class="footer-text"><a href="/auth/login">Voltar ao login</a></p>
      </div>
    </section>
  </main>
  <script src="{{ request.url_for('static', path='js/stars.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ request.url_for('static', path='img/logo.png') }}">
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/login.css') }}?v=3">
  <title>Redefinir senha | EasyStore</title>
</head>
<body>
<main class="page" id="page">
  <!-- BRANDING -->
  <aside class="branding" aria-label="EasyStore Branding">
    <div class="brand-content">
      <div class="logo-row">
        <img class="logo-icon" src="{{ request.url_for('static', path='img/logo.png') }}" alt="EasyStore logo">
        <span class="brand-name">EasyStore</span>
      </div>
      <p class="tagline">Gestão inteligente<br>para o seu negócio</p>
      <p class="sub">Controle de estoque, vendas e catálogo de forma simples e eficiente.</p>
    </div>
  </aside>

  <!-- FORM SIDE -->
  <section class="form-side" aria-labelledby="reset-title">
    <div class="login-box">
      <h1 id="reset-title">Redefinir senha</h1>
      
      {% if erro %}
        <div class="login-error" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ erro }}</span>
        </div>
      {% endif %}
      
      {% if mensagem %}
        <div class="login-success" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <span>{{ mensagem }}</span>
        </div>
      {% endif %}

      <form id="reset-form" action="/auth/reset-password" method="post">
        <input type="hidden" name="token" value="{{ token }}">
        
        <div class="input-group">
          <label for="senha">Nova senha</label>
          <div class="password-control">
            <input id="senha" type="password" name="nova_senha" placeholder="Digite a nova senha" required minlength="6">
            <button type="button" class="password-toggle" aria-controls="senha" aria-pressed="false" aria-label="Mostrar senha" title="Mostrar senha"></button>
          </div>
        </div>
        
        <div class="input-group">
          <label for="confirmar_senha">Confirmar nova senha</label>
          <div class="password-control">
            <input id="confirmar_senha" type="password" name="nova_senha_confirm" placeholder="Confirme a nova senha" required minlength="6">
            <button type="button" class="password-toggle" aria-controls="confirmar_senha" aria-pressed="false" aria-label="Mostrar senha" title="Mostrar senha"></button>
          </div>
        </div>
        
        <button type="submit" class="btn-confirm">Alterar senha</button>
      </form>

      <div class="login-links">
        <p class="footer-text"><a href="/auth/login">Voltar ao login</a></p>
      </div>
    </div>
  </section>
</main>
<script src="{{ request.url_for('static', path='js/login.js') }}?v=3" defer></script>
</body>
</html>

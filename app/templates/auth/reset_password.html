<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ request.url_for('static', path='img/logo.png') }}">
  <title>Redefinir senha | EasyStore</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/login.css') }}?v=3">
</head>
<body>
  <main class="page" id="page">
    <aside class="branding" id="branding" aria-label="EasyStore">
      <div class="bg-layer" id="bgLayer"></div>
      <div class="stars" id="stars"></div>
      <div class="brand-content">
        <div class="logo-row">
          <img class="logo-icon" src="{{ request.url_for('static', path='img/logo.png') }}" alt="EasyStore logo">
          <span class="brand-name" id="brandName">EasyStore</span>
        </div>
        <p class="tagline" id="tagline">Recupere sua conta<br>com segurança</p>
        <p class="sub">Defina uma nova senha e volte ao sistema.</p>
      </div>
    </aside>

    <section class="form-side" aria-labelledby="reset-title">
      <div class="login-box">
        <h1 id="reset-title">Redefinir senha</h1>
        {% if erro %}
        <p class="login-error" role="alert">{{ erro }}</p>
        {% endif %}
        {% if mensagem %}
        <p class="login-success" role="status">{{ mensagem }}</p>
        {% endif %}

        <form action="/auth/reset-password" method="post">
          <input type="hidden" name="token" value="{{ token }}">
          <div class="input-group">
            <label for="nova_senha">Nova senha</label>
            <input id="nova_senha" type="password" name="nova_senha" placeholder="Digite a nova senha" minlength="6" autocomplete="new-password" required>
          </div>
          <div class="input-group">
            <label for="nova_senha_confirm">Confirmar nova senha</label>
            <input id="nova_senha_confirm" type="password" name="nova_senha_confirm" placeholder="Confirme a nova senha" minlength="6" autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn-confirm">Alterar senha</button>
        </form>

        <p class="footer-text"><a href="/auth/login">Voltar ao login</a></p>
      </div>
    </section>
  </main>
  <script src="{{ request.url_for('static', path='js/stars.js') }}"></script>
</body>
</html>

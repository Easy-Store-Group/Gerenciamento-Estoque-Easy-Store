<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ request.url_for('static', path='img/logo.png') }}">
  <title>Entrar | EasyStore</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/login.css') }}?v=3">
</head>
<body>
  <main class="page" id="page">
    <aside class="branding" id="branding" aria-label="EasyStore">
      <div class="bg-layer" id="bgLayer"></div>
      <div class="stars" id="stars"></div>
      <div class="brand-content">
        <div class="logo-row">
          <img class="logo-icon" src="{{ request.url_for('static', path='img/logo.png') }}" alt="EasyStore">
          <span class="brand-name" id="brandName">EasyStore</span>
        </div>
        <p class="tagline" id="tagline">Gestão inteligente<br>para o seu negócio</p>
        <p class="sub">Seu universo gamer começa aqui.</p>
      </div>
    </aside>

    <section class="form-side" aria-labelledby="login-title">
      <div class="login-box">
        <h1 id="login-title">Entrar</h1>
        {% if erro %}
        <p class="login-error" role="alert">{{ erro }}</p>
        {% endif %}
        <form id="login-form" action="/auth/login" method="post">
          <div class="input-group">
            <label for="email">E-mail</label>
            <input id="email" type="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
          </div>
          <div class="input-group">
            <label for="senha">Senha</label>
            <input id="senha" type="password" name="senha" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn-confirm">Confirmar</button>
          <p class="footer-text">Não tem conta? <a href="/auth/register">Cadastre-se</a></p>
          <p class="footer-text">Voltar para o <a href="/">Início</a></p>
        </form>
      </div>
    </section>
  </main>
  <script src="{{ request.url_for('static', path='js/stars.js') }}"></script>
  <script src="{{ request.url_for('static', path='js/login.js') }}?v=2" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/login.css') }}?v=2">
  <title>Entrar | EasyStore</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ request.url_for('static', path='img/logo.png') }}">
    <link rel="stylesheet" href="{{ request.url_for('static', path='css/login.css') }}">
    <title>EasyStore</title>
</head>

<body>
  <main class="page" id="page">
    <aside class="branding" id="branding" aria-label="EasyStore">
      <div class="bg-layer" id="bgLayer"></div>
      <div class="stars" id="stars"></div>

      <div class="brand-content">
        <div class="logo-row">
          <img class="logo-icon" src="{{ request.url_for('static', path='img/logo.png') }}" alt="EasyStore">
          <span class="brand-name" id="brandName">EasyStore</span>
        </div>
        <p class="tagline" id="tagline">
          Gestão inteligente<br>
          para o seu negócio
        </p>
        <p class="sub">Seu universo gamer começa aqui.</p>
      </div>
    </aside>

  <!-- FORM SIDE -->
  <div class="form-side">
    <div class="login-box">
      <h2>Entrar</h2>
      {% if erro %}
        <p style="color: red;">{{ erro }}</p>
      {% endif %}
      <form action="/auth/login" method="post">
        <div class="input-group">
          <label>E-mail</label>
          <input type="email" name="email" placeholder="Digite seu e-mail">
        </div>
        <div class="input-group">
          <label>Senha</label>
          <input type="password" name="senha" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-confirm">✦ Confirmar</button>
        <p class="footer-text">Não tem conta? <a href="/auth/register">Cadastre-se</a></p>
        <p class="footer-text">Voltar para o <a href="/">Início</a></p>
      </form>
    </div>
  </div>
</div>
<script src="{{ request.url_for('static', path='js/stars.js') }}"></script>
</body>

</html>
